[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgflow"
version = "0.4.0"
description = "Text-conditioned structured 3D scene generation for Blender"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "torch>=2.0",
  "openai>=1.40,<4",
]

[project.optional-dependencies]
text = ["sentence-transformers>=2.2"]
test = ["pytest>=8.0"]

[project.scripts]
sgflow-train = "sgflow.train:main"
sgflow-textures = "sgflow.tex_assets:main"
sgflow-openai = "sgflow.openai_compat:main"
sgflow-doctor = "sgflow.runtime:main"
sgflow-device = "sgflow.device:main"

[tool.setuptools.packages.find]
include = ["sgflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
